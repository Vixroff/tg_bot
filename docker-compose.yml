services:
  api:
    build: .
    env_file:
      - .env
    command:
      - "poetry run alembic upgrade head && poetry run uvicorn --host 0.0.0.0 --port 8000 backend.api.main:app"
    ports:
      - "8000:8000"
    depends_on:
      - db

  bot:
    build: .
    env_file:
      - .env
    command:
      - "poetry run python -m backend.bot.main"
    depends_on:
      - db
  
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
