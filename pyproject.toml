[tool.poetry]
name = "kosten-bot"
version = "0.1.0"
description = ""
authors = ["Maksim Vikhrov <maxvihr@yandex.ru>"]
readme = "README.md"
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "3.14.4"
aiogram = "^3.26.0"
sqlalchemy = "^2.0.48"
alembic = "^1.18.4"
asyncpg = "^0.31.0"
uvicorn = "^0.41.0"
fastapi = "^0.135.1"
aio-pika = "^9.6.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.19.1"
ruff = "^0.15.4"
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
httpx = "^0.28.1"
aiosqlite = "^0.21.0"
greenlet = "^3.2.4"

[tool.ruff]
line-length = 120

[tool.pytest]
asyncio_mode = "auto"
testpaths = "tests"
